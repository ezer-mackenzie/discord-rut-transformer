site_name: discord-rut-transformer
site_description: A typed discord.py transformer for validated Chilean RUT values.
site_author: Eli-ezer Reuven Ramirez Ruiz
site_url: https://discord-rut-transformer.readthedocs.io/
repo_name: ezer-mackenzie/discord-rut-transformer
repo_url: https://github.com/ezer-mackenzie/discord-rut-transformer
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Eli-ezer Reuven Ramirez Ruiz
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - Error handling: error-handling.md
  - API reference: api.md
  - Versioning: versioning.md
  - Releasing: releasing.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
