name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Validate wheel installation
        shell: bash
        run: |
          python -m venv /tmp/discord-rut-transformer-publish-test
          /tmp/discord-rut-transformer-publish-test/bin/python -m pip install dist/*.whl
          /tmp/discord-rut-transformer-publish-test/bin/python -c "import discord_rut_transformer; from discord_rut_transformer import RutOption, RutTransformer, RutTransformError; assert discord_rut_transformer.__version__ == '${GITHUB_REF_NAME#v}'; print(RutOption, RutTransformer.__name__, RutTransformError.__name__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/discord-rut-transformer
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
