[project]
name = "discord-rut-transformer"
version = "0.1.0"
description = "Utilidades para transformar y validar RUT chilenos en aplicaciones de Discord"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Eli-ezer Reuven Ramirez Ruiz",email = "ramirez.ruiz.eliezer.reuven@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "rut-validator (>=1.0.0,<2.0.0)",
    "discord-py (>=2.7.1,<3.0.0)"
]

[project.urls]
Repository = "https://github.com/Eli-ezer/discord-rut-transformer"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "benchcore (>=1.0.0,<2.0.0)"
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
