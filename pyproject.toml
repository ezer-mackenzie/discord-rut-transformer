[project]
name = "discord-rut-transformer"
version = "1.0.0"
description = "A typed discord.py app-command transformer for validated Chilean RUT values"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Eli-ezer Reuven Ramirez Ruiz",email = "ramirez.ruiz.eliezer.reuven@gmail.com"}
]
keywords = ["discord", "discord.py", "rut", "chile", "validation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "rut-validator (>=1.0.0,<2.0.0)",
    "discord-py (>=2.7.1,<3.0.0)"
]

[project.urls]
Documentation = "https://discord-rut-transformer.readthedocs.io/"
Issues = "https://github.com/ezer-mackenzie/discord-rut-transformer/issues"
Changelog = "https://github.com/ezer-mackenzie/discord-rut-transformer/blob/main/CHANGELOG.md"
Repository = "https://github.com/ezer-mackenzie/discord-rut-transformer"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "benchcore (>=1.0.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
docs = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings-python (>=2.0.6,<3.0.0)"
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=discord_rut_transformer --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
